name: Render Coaster Video with Voiceover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Extract Video Project
        run: |
          mkdir project
          unzip -q coaster_loop_video_project.zip -d project

      - name: Install Dependencies
        working-directory: project
        run: npm ci

      - name: Render Video
        working-directory: project
        run: |
          mkdir -p out
          npx remotion render src/index.jsx Full out/video.mp4 --codec=h264 --crf=18 --concurrency=2 --gl=angle

      - name: Add Hindi Voiceover
        working-directory: project
        run: |
          ffmpeg -y -i out/video.mp4 -i voiceover.wav \
          -map 0:v:0 -map 1:a:0 \
          -c:v copy -c:a aac -b:a 192k \
          -shortest -movflags +faststart final.mp4

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: Final-Coaster-Video
          path: project/final.mp4
